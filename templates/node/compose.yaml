# 変数は .env から読み込む (make node / make vue 等で生成)
services:
  app:
    build: .
    tty: true
    container_name: ${CONTAINER_NAME}
    working_dir: /opt/app
    # 開発サーバーを自動起動する。DEV_COMMAND を空にすると起動せず待機 (exec で入って手動実行)
    command: ["sh", "-c", "${DEV_COMMAND:-tail -f /dev/null}"]
    volumes:
      # node_modules もホスト側に置く (エディタ補完がそのまま効く)
      - .:/opt/app
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: ${APP_PORT}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_TEST: ${LETSENCRYPT_TEST:-}
      CERT_NAME: ${CERT_NAME:-}
      TZ: ${TZ:-Asia/Tokyo}
      # Vite (Vue / Nuxt 等) はホスト名チェックで未知のホストを拒否するため、プロキシ経由のホスト名を許可する
      # Vite を使わないフレームワークでは無視される
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${VIRTUAL_HOST}
    networks:
      - my_infra_network   # my_database / my_redis / mail に接続できる
      - my_proxy_network

networks:
  my_infra_network:
    external: true
    name: my_infra_network
  my_proxy_network:
    external: true
    name: my_proxy_network
