# Node 系フレームワークの設定
#
#   [名前]           make <名前> NAME=xxx / make node NAME=xxx FW=<名前> で使う
#   create = ...     プロジェクト作成コマンド。{NAME} はアプリ名に置き換わる
#                    質問が出ないオプションを付けること (--yes / --default 等)
#                    node:lts-alpine コンテナ内の apps/ で実行される (git は入っていない)
#   dev    = ...     開発サーバーの起動コマンド。コンテナ外から繋がるよう 0.0.0.0 で待ち受けること
#   port   = ...     開発サーバーのポート (nginx-proxy の転送先)
#
# 依存のインストール (npm install) は作成後に自動で行うので、create 側でしなくてよい
# コメントは行頭の # のみ (行の途中の # はコマンドの一部として扱われる)

[vue]
create = npm create vue@latest {NAME} -- --default
dev    = npm run dev -- --host 0.0.0.0
port   = 5173

[nuxt]
create = npm create nuxt@latest {NAME} -- --template minimal --packageManager npm --no-gitInit --no-install --no-modules
dev    = npm run dev -- --host 0.0.0.0
port   = 3000

[hono]
create = npm create hono@latest {NAME} -- --template nodejs --pm npm --install
dev    = npm run dev
port   = 3000
