# 変数は .env (compose 用) から読み込む。
# 秘密情報 (DATABASE_URL 等) は .env.local に置き、env_file でコンテナの環境変数として渡す
# (OTel 拡張は Symfony の Dotenv より先に環境変数を読むため)
services:
  app:
    build:
      context: .
      args:
        # true にすると OpenTelemetry 拡張を入れてビルドする (切り替え後は up -d --build)
        OTEL_ENABLED: ${OTEL_ENABLED:-false}
    container_name: ${CONTAINER_NAME}
    env_file:
      - path: .env.local
        required: false
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_TEST: ${LETSENCRYPT_TEST:-}
      CERT_NAME: ${CERT_NAME:-}
      TZ: ${TZ:-Asia/Tokyo}
      # OTEL_ENABLED=false (デフォルト) なら SDK を初期化しない = 送信もエラーも起きない
      OTEL_PHP_AUTOLOAD_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-my_symfony}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://my-tempo:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext,baggage}
    volumes:
      - .:/var/www/html
      - vendor-store:/var/www/html/vendor
      # neovim(ホスト)で docker 経由の phpactor を使う際、rootUri/定義ジャンプ先のパスを
      # ホスト側パスと一致させるためのミラーマウント (未設定時はダミーのパスにマウント)
      - .:${HOST_PROJECT_PATH:-/mnt/host-project}
      - vendor-store:${HOST_PROJECT_PATH:-/mnt/host-project}/vendor
    networks:
      - my_infra_network
      - my_proxy_network

  # ホスト側に vendor を入れる (エディタ補完用): docker compose run --rm local-composer install
  local-composer:
    image: composer:latest
    container_name: ${CONTAINER_NAME}-composer
    working_dir: /var/www/html
    environment:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-opentelemetry
    volumes:
      - .:/var/www/html
    profiles:
      - tools
    entrypoint: [ "composer" ]

volumes:
  vendor-store:

networks:
  my_infra_network:
    external: true
    name: my_infra_network
  my_proxy_network:
    external: true
    name: my_proxy_network
